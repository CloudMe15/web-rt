<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelayanan Desa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen md:h-screen md:overflow-hidden flex flex-col">

    <div id="loginPage" class="flex items-center justify-center min-h-screen bg-slate-800 relative z-50 p-4">
        <div class="bg-white p-6 md:p-8 rounded-lg shadow-2xl w-full max-w-md border-t-4 border-blue-600">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Portal Desa Real-Time</h2>
                <p class="text-sm text-slate-500">Silakan masuk sesuai akun Anda (rt1-rt19, operator, super)</p>
            </div>
            
            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Contoh: rt1, operator, super" class="w-full px-4 py-2.5 border border-slate-300 rounded focus:outline-none focus:border-blue-600 bg-slate-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Password (123)" class="w-full px-4 py-2.5 border border-slate-300 rounded focus:outline-none focus:border-blue-600 bg-slate-50 text-sm">
                </div>
                <div id="loginError" class="hidden text-rose-600 text-sm font-semibold text-center bg-rose-50 p-2 rounded border border-rose-200">
                    Username atau Password salah!
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded hover:bg-blue-700 transition shadow-md text-sm">Masuk</button>
            </form>
        </div>
    </div>

    <div id="dashboardRT" class="hidden min-h-screen md:h-full flex flex-col overflow-y-auto bg-slate-50">
        <header class="bg-emerald-600 text-white shadow-md py-3 px-4 md:px-6 flex justify-between items-center shrink-0">
            <div>
                <h1 id="rtNamaHeader" class="text-base md:text-xl font-bold">Ketua RT</h1>
                <p class="text-[10px] md:text-xs text-emerald-200">Panel Pengajuan Layanan Warga</p>
            </div>
            <button id="btnLogoutRT" class="bg-emerald-800 hover:bg-rose-600 px-3 py-1.5 rounded text-xs font-bold transition flex items-center gap-1"><i data-feather="log-out" class="w-3.5 h-3.5"></i> Keluar</button>
        </header>

        <main class="max-w-5xl mx-auto w-full p-4 md:p-6 space-y-6 flex-1">
            <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-base md:text-lg text-slate-800 mb-4 flex items-center gap-2"><i data-feather="edit" class="text-emerald-500 w-5 h-5"></i> Buat Laporan Baru</h3>
                <form id="formLaporanRT" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pemohon</label>
                        <input type="text" id="rtInputNama" required class="w-full border border-slate-300 rounded p-2 text-sm focus:border-emerald-500 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nomor Handphone (WA)</label>
                        <input type="text" id="rtInputWA" required class="w-full border border-slate-300 rounded p-2 text-sm focus:border-emerald-500 bg-slate-50">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Jenis Layanan</label>
                        <select id="rtInputLayanan" required class="w-full border border-slate-300 rounded p-2 text-sm focus:border-emerald-500 bg-slate-50">
                            <option value="">Pilih Jenis Layanan...</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Keterangan / Keperluan</label>
                        <textarea id="rtInputKeperluan" required rows="2" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-emerald-500 bg-slate-50"></textarea>
                    </div>
                    <div class="md:col-span-2 bg-slate-50 p-3 border border-slate-200 rounded">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Upload Lampiran (KTP/KK - Otomatis Kompres)</label>
                        <input type="file" id="rtInputBerkas" required accept="image/*,application/pdf" class="w-full text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-emerald-100 file:text-emerald-700 hover:file:bg-emerald-200">
                    </div>

                    <div class="md:col-span-2 flex justify-end mt-2">
                        <button type="submit" id="btnKirim" class="w-full md:w-auto bg-emerald-600 text-white font-bold text-sm px-6 py-2.5 rounded shadow hover:bg-emerald-700 transition">Kirim Data & Berkas ke Desa</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-base md:text-lg text-slate-800 mb-4 flex items-center gap-2"><i data-feather="clock" class="text-emerald-500 w-5 h-5"></i> Riwayat Layanan Saya</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-100 text-slate-600 border-b">
                            <tr>
                                <th class="py-2 px-3">Tiket</th>
                                <th class="py-2 px-3">Nama Pemohon</th>
                                <th class="py-2 px-3">Layanan & Lampiran</th>
                                <th class="py-2 px-3">Status Desa</th>
                            </tr>
                        </thead>
                        <tbody id="tabelDataRT" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="dashboardOperator" class="hidden min-h-screen md:h-full flex flex-col md:flex-row overflow-x-hidden">
        <aside class="w-full md:w-64 bg-[#222d32] text-slate-300 flex flex-col shrink-0">
            <div class="h-14 bg-[#367fa9] text-white flex items-center justify-center font-bold text-lg tracking-wide shrink-0" id="sidebarTitle">AdminPelayanan</div>
            <div class="p-3 md:p-4 flex items-center gap-3 border-b border-slate-700">
                <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-600 flex items-center justify-center text-white font-bold text-base md:text-xl"><i data-feather="user"></i></div>
                <div>
                    <p id="opGreetingName" class="text-sm font-bold text-white leading-tight">Operator</p>
                    <p class="text-xs text-emerald-400 flex items-center gap-1 mt-0.5"><span class="w-2 h-2 rounded-full bg-emerald-400 block"></span> Online</p>
                </div>
            </div>
            <nav class="py-2 flex md:flex-col overflow-x-auto gap-1 px-2 md:px-0">
                <button onclick="filterOpStatus('Semua')" id="menu-Semua" class="op-menu shrink-0 md:w-full flex items-center gap-2 md:gap-3 px-3 md:px-4 py-2 md:py-3 text-xs md:text-sm transition bg-[#1e282c] md:border-l-4 border-[#3c8dbc] text-white rounded md:rounded-none">
                    <i data-feather="database" class="w-3.5 h-3.5"></i> Semua
                </button>
                <button onclick="filterOpStatus('Menunggu')" id="menu-Menunggu" class="op-menu shrink-0 md:w-full flex items-center gap-2 md:gap-3 px-3 md:px-4 py-2 md:py-3 text-xs md:text-sm transition md:border-l-4 border-transparent text-slate-400 hover:text-white rounded md:rounded-none">
                    <i data-feather="message-square" class="w-3.5 h-3.5"></i> Masuk
                </button>
                <button onclick="filterOpStatus('Diproses')" id="menu-Diproses" class="op-menu shrink-0 md:w-full flex items-center gap-2 md:gap-3 px-3 md:px-4 py-2 md:py-3 text-xs md:text-sm transition md:border-l-4 border-transparent text-slate-400 hover:text-white rounded md:rounded-none">
                    <i data-feather="refresh-cw" class="w-3.5 h-3.5"></i> Diproses
                </button>
                <button onclick="filterOpStatus('Selesai')" id="menu-Selesai" class="op-menu shrink-0 md:w-full flex items-center gap-2 md:gap-3 px-3 md:px-4 py-2 md:py-3 text-xs md:text-sm transition md:border-l-4 border-transparent text-slate-400 hover:text-white rounded md:rounded-none">
                    <i data-feather="check-circle" class="w-3.5 h-3.5"></i> Selesai
                </button>
                <button onclick="
